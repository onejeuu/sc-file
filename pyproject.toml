[project]
name = "sc-file"
description = "Utility & Library for decoding stalcraft assets"

dynamic = ["version"]

requires-python = ">=3.13"

authors = [{ name = "onejeuu", email = "mail@66rk.ru" }]

readme = "README.md"
license = "MIT"
license-files = ["NOTICE"]

dependencies = [
    "click>=8.4.2,<9.0.0",
    "lz4>=4.4.5,<5.0.0",
    "numpy>=2.4.6,<3.0.0",
    "rich>=15.0.0,<16.0.0",
    "zstandard>=0.25.0,<1.0.0",
]

[project.optional-dependencies]
gui = ["pyside6>=6.11.1,<7.0.0"]

[dependency-groups]
build = ["pyinstaller>=6.21.0,<7.0.0"]

dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
]

docs = [
    "sphinx>=8.2.3,<9.0.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.5.2,<3.6.0",
    "sphinx-book-theme>=1.4.0",
    "sphinx-intl>=2.3.2",
]

[project.urls]
Homepage = "https://github.com/onejeuu/sc-file"
Repository = "https://github.com/onejeuu/sc-file"
Documentation = "https://sc-file.readthedocs.io"

[project.scripts]
scfile = "scfile.app.launcher:main"

[tool.setuptools]
packages = { find = { include = ["scfile", "scfile.*"] } }

[tool.setuptools.dynamic]
version = { attr = "scfile.__version__" }

[tool.setuptools.package-data]
scfile = ["app/gui/assets/*"]

[tool.coverage.run]
branch = true
omit = []

[tool.coverage.report]
fail_under = 85

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

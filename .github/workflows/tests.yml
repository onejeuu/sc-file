name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - "scfile/**"
      - "tests/**"
      - ".github/workflows/*.yml"

  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements*.txt"
      - "scfile/**"
      - "tests/**"
      - ".github/workflows/*.yml"

jobs:
  tests-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run Tests
        run: uv run --group dev pytest --cov=scfile --cov-report=term-missing

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Маппинг блоков · STALCRAFT → Minecraft 1.12.2</title>
<style>
:root{color-scheme:dark;--bg:#0d0f12;--panel:#15191e;--panel2:#1b2026;--line:#303740;--txt:#e7e9ec;--muted:#9aa2ab;--accent:#e3bd5c;--accent-bg:#2a2518;--red:#d98989;--green:#9bcaa4;--radius:8px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.38;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 10px}
button:hover:not(:disabled){border-color:#626c77;background:#252b32}
.primary{background:var(--accent);color:#191a1b;border-color:var(--accent);font-weight:650}
.primary:hover:not(:disabled){background:#edca75;border-color:#edca75}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hidden{display:none!important}
header{height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#111418;border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{font-size:16px;font-weight:700;white-space:nowrap}
.header-subtitle{font-size:11px;color:var(--muted);white-space:nowrap}
.header-stats{font-size:11px;color:var(--muted);white-space:nowrap;margin-left:8px}
.spacer{flex:1}
.header-button{min-width:34px;height:32px;padding:4px 9px}
.header-actions{display:flex;align-items:center;gap:7px}
.header-transfer{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:transparent;color:var(--txt);font-size:12px;font-weight:500;white-space:nowrap}
.header-transfer:hover:not(:disabled){border-color:#626c77;background:var(--panel2)}
.transfer-icon{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.app{height:calc(100% - 54px);min-height:400px;display:grid;grid-template-columns:clamp(270px,22vw,330px) minmax(0,1fr)}
.app.has-group{grid-template-columns:clamp(250px,20vw,310px) clamp(250px,19vw,310px) minmax(0,1fr)}
.sidebar{min-height:0;display:flex;flex-direction:column;background:#111418;border-right:1px solid var(--line)}
.sidebar-head{padding:14px 13px 11px;border-bottom:1px solid var(--line);flex:none}
.sidebar-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}
.sc-count{font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.search{width:100%;height:36px;margin-top:11px;border:1px solid var(--line);border-radius:6px;background:#0d1014;padding:0 10px;outline:0}
.search:focus{border-color:#777f88}
.search::placeholder{color:#89919a}
.filters{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{padding:5px 8px;font-size:11px;border-radius:5px}
.chip.active{border-color:#a98636;color:var(--accent);background:var(--accent-bg)}
.switch-label{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;min-height:28px;color:#c9ced3;font-size:11px;white-space:nowrap}
.switch-label input{position:absolute;opacity:0;width:1px;height:1px}
.switch-track{width:32px;height:18px;border-radius:10px;background:#41474f;position:relative;flex:none;transition:background .12s ease}
.switch-track::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#c6cbd0;transition:transform .12s ease}
.switch-label input:checked+.switch-track{background:#98772f}
.switch-label input:checked+.switch-track::after{transform:translateX(14px);background:#fff0c6}
.switch-label input:focus-visible+.switch-track{outline:2px solid var(--accent);outline-offset:3px}
.switch-label:has(input:disabled){opacity:.45;cursor:not-allowed}
.sync-setting{margin-top:9px}
.sc-list{min-height:0;overflow:auto;flex:1;scrollbar-color:#3d444d transparent}
.relations-sidebar{min-width:0;min-height:0;display:flex;flex-direction:column;background:#12161b;border-right:1px solid var(--line)}
.relations-sidebar[hidden]{display:none}
.relations-head{padding:14px 12px 10px;border-bottom:1px solid var(--line);flex:none}
.relations-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.relations-count{font-size:10px;color:var(--muted);font-weight:400}
.relations-summary{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45}
.relations-content{min-height:0;flex:1;overflow:auto;padding:9px 0;scrollbar-color:#3d444d transparent}
.relation-group{margin:0 9px 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}.relation-group:last-child{border-bottom:0;margin-bottom:0}.relation-group-head{font-size:10px;font-weight:650;color:var(--muted);margin-bottom:8px}.relation-section{margin-bottom:12px}
.relation-section-head{display:flex;align-items:center;gap:7px;padding:3px 2px 7px;font-size:11px;font-weight:650;color:#d3d8de}
.relation-section-count{font-size:10px;color:var(--muted);font-weight:400}
.relation-sync-state{font-size:10px;color:var(--muted);padding:0 2px 6px}
.relation-sync-state.conflict{color:#d9b978}
.relation-apply{width:100%;padding:5px 7px;font-size:10px;margin:0 0 7px}
.relation-member{color:var(--text);font:inherit;cursor:pointer;min-width:0}
.relation-member.current{background:#262b31;box-shadow:inset 3px 0 var(--accent)}
.relation-external-sync{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-row{width:100%;min-height:74px;display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:9px;padding:8px 10px;border:0;border-bottom:1px solid #252b31;border-radius:0;background:transparent;text-align:left}
.sc-row:hover{background:#1c2127}
.sc-row.active{background:#262b31;box-shadow:inset 3px 0 var(--accent)}
.sc-row:focus-visible{outline-offset:-2px}
.row-pair{display:flex;gap:3px;min-width:0}
.mini{width:42px;height:42px;min-width:0;flex:1;object-fit:contain;background:repeating-conic-gradient(#30353b 0 25%,#20252a 0 50%) 50%/12px 12px;border:1px solid #3b424a;border-radius:4px;image-rendering:pixelated}
.row-text{min-width:0;display:grid;gap:3px}
.row-title-line{display:flex;align-items:center;gap:5px;min-width:0}
.row-title{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row-duplicate{font-size:9px;color:#d7bb76;border:1px solid #5c4d2d;border-radius:4px;padding:1px 4px;flex:none;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-target-name{font-size:11px;color:#c5cbd1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-ids{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workspace{min-width:0;min-height:0;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding:16px 20px 0;gap:10px}
.compare-area{min-width:0}
.compare-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.compare-card{min-width:0;display:grid;grid-template-rows:auto minmax(150px,clamp(150px,24vh,258px)) auto minmax(34px,auto);padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.card-heading{min-height:54px;min-width:0}
.side-label{font-size:10px;font-weight:700;letter-spacing:.07em;color:#aeb5bd;margin-bottom:4px}
.block-title-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-width:0}
.block-name{font-size:16px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;min-width:0;flex:1}
.block-id{font-size:11px;color:#b5bdc5;margin:0;display:block;flex:0 1 auto;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.preview-label{display:inline-block;margin-left:7px;color:var(--accent);font-size:10px;font-weight:500;vertical-align:middle}
.preview-stage{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #292f36;border-radius:6px;background:#0e1115;padding:10px}
.preview-stage img{display:block;width:min(100%,220px);height:100%;max-height:220px;object-fit:contain;image-rendering:pixelated}
.noimage{width:min(100%,190px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px dashed #39414a;border-radius:5px;color:var(--muted);font-size:11px;text-align:center;padding:12px}
.path-row{height:30px;display:flex;align-items:end;min-width:0;padding-top:6px}
.path-text{font-size:10px;color:#b7c0c8;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-bottom{min-height:34px;display:flex;align-items:end;gap:6px;min-width:0;overflow:hidden}
.source-kind{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.source-variants{display:flex;gap:5px;align-items:center;max-width:100%;overflow-x:auto;padding:2px 0}
.variant-button{font-size:10px;padding:4px 7px;border-radius:4px;flex:none}
.variant-button.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.target-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.target-actions button{font-size:10px;padding:5px 8px}
.catalog{min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:10px}
.catalog-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none;padding-bottom:9px}
.catalog-title{font-size:14px;font-weight:700;white-space:nowrap}
.catalog-count{font-size:10px;color:var(--muted);font-weight:400;margin-left:7px}
.catalog-search{height:33px;width:min(320px,34%);min-width:140px;margin:0}
.catalog-settings{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-left:auto}
.catalog-grid{min-height:0;flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));align-content:start;gap:8px;padding:2px 2px 14px;scrollbar-color:#3d444d transparent}
.mc-tile{position:relative;min-width:0;min-height:126px;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:7px;border:1px solid var(--line);border-radius:6px;background:#14181d;text-align:left;overflow:hidden}
.mc-tile:hover{border-color:#77818c;background:#1d2329}
.mc-tile.selected{border-color:var(--accent);background:#272315}
.mc-tile.previewing{border-color:#8b9bab;background:#202831}
.mc-tile:focus-visible{outline-offset:1px}
.mc-tile-top{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:10px;font-weight:650}
.mc-tile-meta{font-size:9px;color:var(--muted)}
.mc-tile img,.mc-tile .noimage{width:100%;height:68px;max-width:100%;object-fit:contain;image-rendering:pixelated;align-self:center}
.mc-tile .noimage{width:68px;height:68px;max-width:100%;box-sizing:border-box;flex:0 0 68px;align-self:center;aspect-ratio:1;font-size:9px;padding:3px;min-height:0}
.mc-tile-name{font-size:10px;line-height:1.25;color:var(--txt);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:25px;overflow-wrap:anywhere}
.mc-tile-texture{font-size:9px;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catalog-empty{grid-column:1/-1;padding:20px;color:var(--muted);font-size:12px}
.toast{position:fixed;z-index:30;bottom:16px;right:16px;padding:10px 14px;background:#252c34;border:1px solid #4b5561;border-radius:7px;box-shadow:0 5px 20px #0008;opacity:0;transform:translateY(6px);transition:.16s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1050px){.app{grid-template-columns:250px minmax(0,1fr)}.app.has-group{grid-template-columns:230px 230px minmax(0,1fr)}.workspace{padding-left:12px;padding-right:12px}.catalog-settings{gap:10px}.catalog-search{width:min(250px,30%)}}
@media(max-width:900px){.app.has-group{grid-template-columns:220px 220px minmax(0,1fr)}.compare-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){html,body{height:auto;min-height:100%}.app,.app.has-group{height:auto;min-height:0;display:flex;flex-direction:column}.sidebar{height:255px;min-height:255px;border-right:0;border-bottom:1px solid var(--line)}.relations-sidebar{height:300px;min-height:180px;max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}.workspace{height:auto;min-height:0;padding:14px 12px 0;display:block}.compare-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.compare-card{grid-template-rows:auto minmax(140px,32vw) auto minmax(34px,auto)}.catalog{height:560px;margin-top:4px}.catalog-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}
@media(max-width:540px){header{padding:0 9px;gap:7px}.brand{font-size:14px}.header-subtitle{display:none}.header-stats{display:none}.header-button{min-width:30px;padding:4px 7px}.header-actions{gap:5px}.header-transfer{height:30px;padding:0 9px;font-size:11px;gap:5px}.transfer-icon{width:14px;height:14px}.compare-grid{grid-template-columns:minmax(0,1fr)}.compare-card{grid-template-rows:auto minmax(160px,54vw) auto minmax(34px,auto)}.catalog-head{align-items:flex-start}.catalog-title{width:100%}.catalog-search{width:100%;max-width:none}.catalog-settings{margin-left:0;width:100%;gap:12px}.catalog{height:650px}}
</style>
</head>
<body>
<header>
 <div class="brand">Маппинг блоков</div>
 <div class="header-subtitle">STALCRAFT → Minecraft Java 1.12.2</div>
 <div class="header-stats" id="header-stats"></div>
 <div class="spacer"></div>
 <button class="header-button" id="undo" title="Ctrl+Z" aria-label="Отменить">↶</button>
 <button class="header-button" id="redo" title="Ctrl+Y" aria-label="Повторить">↷</button>
 <div class="header-actions">
 <button class="header-transfer" id="import-base" type="button" title="Импортировать базовый маппинг" aria-label="Импорт">
  <svg class="transfer-icon icon-arrow-down" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v7m0 0 2.5-2.5M8 9 5.5 6.5M3 10.5v2A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg>
  <span>Импорт</span>
 </button>
 <button class="header-transfer" id="export-full" type="button" title="Экспортировать полный маппинг" aria-label="Экспорт">
  <svg class="transfer-icon icon-arrow-up" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 9V2m0 0 2.5 2.5M8 2 5.5 4.5M3 10.5v2A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5v-2"/></svg>
  <span>Экспорт</span>
 </button>
</div>
<input type="file" id="base-file" accept=".json,application/json" hidden>
</header>
<div class="app" id="app">
 <aside class="sidebar">
  <div class="sidebar-head">
   <div class="sidebar-title"><span>Блоки STALCRAFT</span><span class="sc-count" id="sc-count"></span></div>
   <input class="search" id="sc-search" placeholder="Поиск…" autocomplete="off">
   <div class="filters">
    <button class="chip active" data-filter="all">Все</button>
    <button class="chip" data-filter="changed">С правками</button>
    <button class="chip" data-filter="unmapped">Не назначены</button>
    <button class="chip" data-filter="textures">Без текстуры</button>
    <button class="chip" data-filter="related">Связи с пропусками</button>
   </div>
   <label class="switch-label sync-setting" for="sync-duplicates"><span>Синхронизировать дубликаты</span><input type="checkbox" id="sync-duplicates"><span class="switch-track"></span></label>
  </div>
  <div id="sc-list" class="sc-list"></div>
 </aside>
 <aside class="relations-sidebar" id="relations-sidebar" hidden>
  <div class="relations-head">
   <div class="relations-title"><span>Группы</span><span class="relations-count" id="relations-count"></span></div>
   <div class="relations-summary" id="relations-summary"></div>
  </div>
  <div class="relations-content" id="relations-content"></div>
 </aside>
 <main class="workspace">
  <section class="compare-area">
   <div class="compare-grid">
    <article class="compare-card" id="source-card">
     <div class="card-heading">
      <div class="side-label">STALCRAFT</div>
      <div class="block-title-line">
       <div class="block-name" id="source-name">—</div>
       <div class="block-id mono" id="source-id">—</div>
      </div>
     </div>
     <div class="preview-stage" id="source-image"></div>
     <div class="path-row"><span class="path-text" id="source-path"></span></div>
     <div class="card-bottom" id="source-bottom"></div>
    </article>
    <article class="compare-card" id="target-card">
     <div class="card-heading">
      <div class="side-label">MINECRAFT</div>
      <div class="block-title-line">
       <div class="block-name" id="target-name">Не назначен</div>
       <div class="block-id mono" id="target-id">—</div>
      </div>
     </div>
     <div class="preview-stage" id="target-image"></div>
     <div class="path-row"><span class="path-text" id="target-path"></span></div>
     <div class="card-bottom"><div class="target-actions" id="target-actions"></div></div>
    </article>
   </div>
  </section>
  <section class="catalog">
   <div class="catalog-head">
    <div class="catalog-title">Каталог Minecraft<span class="catalog-count" id="catalog-count"></span></div>
    <input class="search catalog-search" id="mc-search" placeholder="Поиск…" autocomplete="off">
    <div class="catalog-settings">
     <label class="switch-label" for="toggle-meta"><span>Варианты metadata</span><input type="checkbox" id="toggle-meta" checked><span class="switch-track"></span></label>
     <label class="switch-label" for="hover-preview"><span>Предпросмотр при наведении</span><input type="checkbox" id="hover-preview" checked><span class="switch-track"></span></label>
    </div>
   </div>
   <div id="catalog-grid" class="catalog-grid"></div>
  </section>
 </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>let BOOT = null; /*__DATA__*/</script>
<script>
(()=>{'use strict';
if(!BOOT||!Array.isArray(BOOT.stalcraft)||!Array.isArray(BOOT.minecraft)){
 document.querySelector('.app').innerHTML='<section style="max-width:700px;margin:12vh auto;padding:28px"><h1>Данные не подготовлены</h1><p>Сначала выполните <span class="mono">uv run -m tools mappings</span>.</p><p class="muted">Пути к исходным файлам задаются в tools/configs/mappings/config.toml.</p></section>';return;
}
const $=id=>document.getElementById(id),S=BOOT.stalcraft,M=BOOT.minecraft,ASSET_ROOT=BOOT.assetsBase??'./';
const SById=new Map(S.map(r=>[r.id,r]));
const byId=new Map();for(const r of M){if(r.id===0)continue;if(!byId.has(r.id))byId.set(r.id,[]);byId.get(r.id).push(r)}
for(const variants of byId.values())variants.sort((a,b)=>a.meta-b.meta);
const sortedIds=[...byId.keys()].sort((a,b)=>a-b);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseTarget(value){if(typeof value!=='string')throw Error('Целевое значение должно быть строкой');const m=/^(0|[1-9]\d*)(?::(0|[1-9]\d*))?$/.exec(value);if(!m)throw Error('Неверное целевое значение: '+value);const id=Number(m[1]),meta=m[2]===undefined?null:Number(m[2]);if(id>4095)throw Error('Minecraft ID вне диапазона 0..4095');if(meta!==null&&meta>15)throw Error('Metadata вне диапазона 0..15');return{id,meta}}
function normalize(obj){if(!obj||Array.isArray(obj)||typeof obj!=='object')throw Error('Ожидается JSON-объект маппинга');const out={};for(const[k,v]of Object.entries(obj)){if(!/^(0|[1-9]\d*)$/.test(k)||+k>4095)throw Error('Неверный исходный ID: '+k);parseTarget(v);out[k]=v}return out}
function normalizeGroups(raw){
 if(!raw||!Array.isArray(raw.groups))throw Error('groups.json должен содержать массив groups');
 const usedSyncIds=new Set(),groups=[];
 for(const [index,group] of raw.groups.entries()){
  if(!group||!Array.isArray(group.ids)||group.ids.length<2)throw Error(`Группа ${index+1}: требуется минимум два ID`);
  const ids=group.ids;if(ids.some(id=>!Number.isInteger(id)||id<0||id>4095)||new Set(ids).size!==ids.length)throw Error(`Группа ${index+1}: некорректные ID`);
  const sync=[];
  if(!Array.isArray(group.sync??[]))throw Error(`Группа ${index+1}: sync должен быть массивом`);
  for(const [syncIndex,members] of (group.sync??[]).entries()){
   if(!Array.isArray(members)||members.length<2)throw Error(`Группа ${index+1}, связка ${syncIndex+1}: требуется минимум два ID`);
